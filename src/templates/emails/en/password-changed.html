<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password changed - TableMaster</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 300; background-color: #FAFAFA; color: #2A2A2A;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #FAFAFA; min-height: 100vh;">
    <tr>
      <td align="center" style="padding: 60px 20px;">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px; background-color: #FFFFFF; border: 1px solid #E5E5E5;">
          <tr>
            <td style="padding: 40px 30px 30px; border-bottom: 1px solid #E5E5E5;">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center">
                    <div style="font-size: 24px; font-weight: 400; color: #0066FF; letter-spacing: -0.5px; margin-bottom: 8px;">TableMaster</div>
                    <div style="font-size: 32px; margin: 20px 0; color: #FF6B35;">🔒</div>
                    <div style="font-size: 20px; font-weight: 400; color: #2A2A2A; margin-top: 16px;">Password changed</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding: 30px;">
              <p style="margin: 0 0 16px 0; font-size: 16px; line-height: 1.6; color: #666666;">
                Hello {{userName}},
              </p>
              <p style="margin: 0 0 24px 0; font-size: 16px; line-height: 1.6; color: #666666;">
                The password for your TableMaster account has just been changed.
              </p>
              <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #FFF5F5; border-left: 2px solid #FF6B35;">
                <tr>
                  <td style="padding: 16px;">
                    <div style="font-size: 13px; color: #CC4A1D; line-height: 1.5;">
                      If you did not make this change, contact us immediately at <a href="mailto:{{contactEmail}}" style="color: #0066FF; text-decoration: underline;">{{contactEmail}}</a>.
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding: 30px; border-top: 1px solid #E5E5E5; background-color: #FAFAFA;">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center">
                    <div style="font-size: 14px; color: #666666; margin-bottom: 8px;">
                      <a href="https://tablemaster.fr" style="color: #0066FF; text-decoration: none; font-weight: 400;">TableMaster</a>
                    </div>
                    <div style="font-size: 12px; color: #999999; line-height: 1.5;">
                      The professional reservation management solution
                    </div>
                    <div style="font-size: 11px; color: #999999; margin-top: 16px;">
                      &copy; 2026 TableMaster. All rights reserved.
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
